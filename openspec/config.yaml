schema: spec-driven

# Standing orders for every OpenSpec artifact and operation (generated by RNC).
context: |
  Language: Portuguese (pt-BR)
  All artifacts must be written in Portuguese (pt-BR).
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Generated by RNC (Reengineering New Code) from a legacy system; RNC workspace 58e6d381-da51-4227-98a5-804213e1fd85.
  openspec/changes/ is the build plan: apply the changes in numeric order and archive each one before starting the next.
  Stack (from the RNC Architecture Canvas — do not invent another): frontend nextjs + shadcn/ui; backend nextjs + prisma; database sqlite; deployment docker-compose; SSO off.
  UI library: shadcn/ui (https://ui.shadcn.com) — every screen uses its components; never a second library.
  Locale pt-BR: dates DD/MM/YYYY, currency symbol R$. Input masks are requirements of 001-project-foundation (capability locale-and-formats); the Mask and Behavior columns of each change's design.md say which field gets which.
  Precedence when documents seem to disagree: author directives (below, VERBATIM) > explicit canvas configuration > derived decisions > defaults.
  Business rules are cited by their stable key RK-<12 hex>, never by BR-nnn.
  NEEDS REVIEW marks a rule that is ambiguous in the legacy source: implement the most probable reading and leave a TODO(review) comment with its RK key.
  Reference tables get a read-only list API and dropdowns, never create/edit/delete screens.
  The RNC MCP server (env RNC_MCP_URL, RNC_MCP_TOKEN) is optional: getRule verifies an RK, getSourceFile reads the legacy code, searchKnowledge answers what the docs leave unclear.

rules:
  proposal:
    - "State what is out of scope; keep legacy behaviors to confirm out of the requirements"
  specs:
    - "A requirement that comes from a legacy rule keeps its RK key in the requirement text"
    - "Use SHALL for normative text; every requirement has at least one scenario with WHEN and THEN"
    - "Never edit openspec/specs/ by hand; change an archived requirement through MODIFIED Requirements"
  design:
    - "Fields marked to confirm have no traced source column: do not derive a column from the field name"
  tasks:
    - "A task that enforces a rule names its RK key and says where in the code the rule is enforced"
    - "Every task says how it is verified (test, command, or manual check)"

operations:
  apply:
    guidance:
      - "Put a // RK-… comment at the exact spot where each business rule is enforced"
      - "For NEEDS REVIEW rules, read the legacy source through the RNC MCP (getSourceFile) before deciding"
      - "Never change a spec to make code pass; record the doubt under design.md Open Questions and stop"
  archive:
    guidance:
      - "Run openspec validate <change> --strict before archiving"
      - "Archive changes in numeric order; the next change assumes the previous one is archived"
